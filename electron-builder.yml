# Packaging config for `npm run dist` (Windows installer). Not yet verified end to end.
appId: dev.vivek.ora
productName: Ora
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.ico
  target: nsis
  artifactName: Ora-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
