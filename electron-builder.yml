# Packaging config for `npm run dist` (Windows NSIS installer + portable exe, per-user, no admin needed). See README > Building and releasing.
appId: dev.vivek.ora
productName: Ora
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Ora-Setup-${version}.${ext}
portable:
  artifactName: Ora-${version}-portable.${ext}
